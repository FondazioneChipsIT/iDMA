package:
  name: idma
  authors:
    - "Thomas Benz <tbenz@iis.ee.ethz.ch>" # current maintainer
    - "Michael Rogenmoser <michaero@iis.ee.ethz.ch>"
    - "Tobias Senti <tsenti@ethz.ch>"
    - "Axel Vanoni <axvanoni@ethz.ch>"

dependencies:
  common_cells:        { path: "../common_cells" }
  axi_node:            { path: "../axi/axi_node" }
  register_interface:  { git: "https://github.com/FondazioneChipsIT/register_interface.git",  rev: d2923e61038d494221c839655192cea7cb791b04  }
  obi:                 { git: "https://github.com/FondazioneChipsIT/obi.git",                 rev: ee35c37d599860fe62b1fcfccd4106d5233ab910  }

export_include_dirs:
  - src/include
  - target/rtl/include
  - test

sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this
  # package. Files in level 1 only depend on files in level 0, files in level 2 on files in
  # levels 1 and 0, etc. Files within a level are ordered alphabetically.
  - target: rtl
    files:
      # Level 0
      - src/idma_pkg.sv
      - target/rtl/idma_reg32_3d_reg_pkg.sv
      # Level 1
      - src/backend/idma_axil_read.sv
      - src/backend/idma_axil_write.sv
      - src/backend/idma_axi_read.sv
      - src/backend/idma_axi_write.sv
      - src/backend/idma_axis_read.sv
      - src/backend/idma_axis_write.sv
      - src/backend/idma_channel_coupler.sv
      - src/backend/idma_dataflow_element.sv
      - src/backend/idma_error_handler.sv
      - src/backend/idma_init_read.sv
      - src/backend/idma_init_write.sv
      - src/backend/idma_legalizer_page_splitter.sv
      - src/backend/idma_legalizer_pow2_splitter.sv
      - src/backend/idma_obi_read.sv
      - src/backend/idma_obi_write.sv
      - src/backend/idma_tilelink_read.sv
      - src/backend/idma_tilelink_write.sv

  # Generated content
  - target: rtl
    files:
      - target/rtl/idma_transport_layer_r_axi_rw_init_rw_obi.sv
      - target/rtl/idma_transport_layer_r_obi_rw_init_w_axi.sv
      - target/rtl/idma_legalizer_r_axi_rw_init_rw_obi.sv
      - target/rtl/idma_legalizer_r_obi_rw_init_w_axi.sv
      - target/rtl/idma_backend_r_axi_rw_init_rw_obi.sv
      - target/rtl/idma_backend_r_obi_rw_init_w_axi.sv
      - target/rtl/idma_backend_synth_r_axi_rw_init_rw_obi.sv
      - target/rtl/idma_backend_synth_r_obi_rw_init_w_axi.sv
      - target/rtl/idma_reg32_3d_reg_top.sv
      - target/rtl/idma_reg32_3d_top.sv

  # Midends
  - target: rtl
    files:
      # Level 0
      - src/midend/idma_mp_dist_midend.sv
      - src/midend/idma_mp_split_midend.sv
      - src/midend/idma_nd_midend.sv
      - src/midend/idma_rt_midend.sv

  # Frontend
  - target: rtl
    files:
      # Level 0
      - src/frontend/idma_transfer_id_gen.sv
